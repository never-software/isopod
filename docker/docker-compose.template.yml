# docker-compose.template.yml — Per-pod container stack
#
# Placeholders are substituted at generation time by isopod create.
#
# Access via OrbStack DNS (no port mapping needed):
#   https://<feature>.orb.local:8443  (code-server)

services:
  workspace:
    image: __IMAGE_NAME__
    container_name: __CONTAINER_NAME__
    hostname: __CONTAINER_NAME__
    init: true
    environment:
      - TZ=UTC
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - CLAUDE_CODE_NO_FLICKER=1
      - ISOPOD_REPOS=__REPO_LIST__
      - STACK_NAME=__STACK_NAME__
      # Add your project-specific environment variables:
      # - PGUSER=postgres
      # - DATABASE_URL=postgres://localhost/myapp_dev
      # - REDIS_URL=redis://localhost:6379/0
    volumes:
      # Named volume for persistent data (database, etc.)
      - data:/data
      # Persist the workspace user's home directory so per-user state survives
      # container recreation — e.g. Claude Code history (~/.claude, ~/.claude.json),
      # shell history, and tool caches. Without this, that state lives in the
      # container's writable layer and is wiped every time the pod is recreated.
      # NOTE: a named volume is seeded from the image on first create, then frozen
      # relative to it. Set the path to match your image's user — /root for the
      # default root user, or /home/<user> if your image runs as a non-root user.
      - home:/root
      # code-server settings and tasks
      - __DOCKER_DIR__/code-server:/root/.local/share/code-server/User:delegated
      - __DOCKER_DIR__/code-server/tasks.json:/workspace/.vscode/tasks.json:ro
      # mkcert certificates (generate with: mkcert "*.orb.local" localhost 127.0.0.1)
      - __DOCKER_DIR__/certs:/certs:ro
      # Pod root mounted at /workspace. Stack workspace template files are copied
      # into the pod root by isopod without overwriting pod-local edits:
__WORKSPACE_TEMPLATE_VOLUMES__
      # Repo bind mounts are injected here by isopod:
__REPO_VOLUMES__

volumes:
  data:
  home:
